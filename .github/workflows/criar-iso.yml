name: Criar CL OS ISO de Verdade
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar CL OS bootavel
        run: |
          sudo apt update
          sudo apt install -y xorriso
          ls -R
          wget -O ubuntu.iso https://releases.ubuntu.com/24.04/ubuntu-24.04-desktop-amd64.iso
          # Copia o Ubuntu e joga sua pasta dentro, mantendo ele bootavel
          xorriso -indev ubuntu.iso -outdev CL-OS.iso -map CL_OS+Gamers /CL_OS -boot_image any replay
          ls -lh CL-OS.iso
      - name: Salvar ISO
        uses: actions/upload-artifact@v4
        with:
          name: CL-OS-ISO
          path: CL-OS.iso
