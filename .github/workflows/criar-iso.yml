name: Criar CL OS ISO de Verdade
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar CL OS bootavel
        run: |
          sudo apt update
          sudo apt install -y xorriso curl
          curl -L -A "Mozilla/5.0" -o ubuntu.iso https://mirrors.kernel.org/ubuntu-releases/24.04.3/ubuntu-24.04.3-desktop-amd64.iso
          ls -lh ubuntu.iso
          xorriso -indev ubuntu.iso -outdev CL-OS.iso -map "CL_OS+Gamers" /CL_OS -boot_image any replay
          ls -lh CL-OS.iso
      - name: Salvar ISO
        uses: actions/upload-artifact@v4
        with:
          name: CL-OS-ISO
          path: CL-OS.iso
